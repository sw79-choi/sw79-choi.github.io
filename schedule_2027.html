<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2027학년도 대입 일정 Gantt</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #172033;
      --muted: #667085;
      --line: #d7dce5;
      --soft: #f6f8fb;
      --apply: #2563eb;
      --exam: #ea580c;
      --result: #16a34a;
      --register: #7c3aed;
      --extra: #64748b;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }
    button {
      font: inherit;
    }
    button.filter {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
    }
    button.filter[aria-pressed="true"] {
      background: var(--fg);
      border-color: var(--fg);
      color: #fff;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      background: currentColor;
    }
    .filter[data-filter="apply"] .dot { color: var(--apply); }
    .filter[data-filter="exam"] .dot { color: var(--exam); }
    .filter[data-filter="result"] .dot { color: var(--result); }
    .filter[data-filter="register"] .dot { color: var(--register); }
    .filter[data-filter="extra"] .dot { color: var(--extra); }

    .chart-wrap {
      position: relative;
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      box-shadow: var(--shadow);
    }
    svg {
      display: block;
      min-width: 1040px;
      width: 100%;
      height: auto;
    }
    .month-line,
    .lane-line,
    .axis {
      stroke: var(--line);
      stroke-width: 1;
    }
    .axis-text,
    .lane-label,
    .bar-label,
    .note-text {
      font-family: inherit;
      fill: var(--fg);
    }
    .axis-text,
    .bar-label { font-size: 13px; }
    .lane-label {
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .note-text {
      fill: var(--muted);
      font-size: 12px;
    }
    .bar {
      rx: 5;
      ry: 5;
      stroke: rgba(23, 32, 51, 0.16);
      stroke-width: 1;
    }
    .bar.apply { fill: rgba(37, 99, 235, 0.62); }
    .bar.exam { fill: rgba(234, 88, 12, 0.68); }
    .bar.result { fill: rgba(22, 163, 74, 0.72); }
    .bar.register { fill: rgba(124, 58, 237, 0.68); }
    .bar.extra { fill: rgba(100, 116, 139, 0.62); }
    .milestone {
      stroke: #fff;
      stroke-width: 2;
    }
    .milestone.result { fill: var(--result); }
    .milestone.register { fill: var(--register); }
    .milestone.extra { fill: var(--extra); }
    .hit { fill: transparent; cursor: default; }
    .tooltip {
      position: absolute;
      max-width: min(330px, calc(100% - 24px));
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -115%);
      transition: opacity 120ms ease;
      background: #fff;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: var(--shadow);
      font-size: 13px;
      z-index: 5;
    }
    .tooltip.is-visible { opacity: 1; }

    .section-title {
      margin: 24px 0 12px;
      font-size: 19px;
      font-weight: 700;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      background: var(--bg);
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
    }
    .univ-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--fg);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-align: left;
    }
    .univ-heading {
      display: grid;
      gap: 3px;
    }
    .univ-button strong {
      font-size: 17px;
    }
    .univ-button small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .chevron {
      color: var(--muted);
      font-size: 18px;
      transform: rotate(0deg);
      transition: transform 120ms ease;
    }
    .card.is-open .chevron {
      transform: rotate(90deg);
    }
    .event-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 8px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
    }
    .event-date {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      white-space: nowrap;
    }
    .event-name {
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .event-name span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail {
      display: none;
      margin-top: 12px;
    }
    .card.is-open .detail {
      display: block;
    }
    .track {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .track-title {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 700;
    }
    .doc-list {
      margin: 8px 0 0;
      padding-left: 18px;
      color: var(--fg);
      font-size: 14px;
      line-height: 1.55;
    }
    .doc-list li { margin: 4px 0; }
    .doc-line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .doc-label {
      flex: 1 1 auto;
      min-width: 0;
    }
    .doc-deadline {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .tag {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      color: #fff;
      background: var(--muted);
      line-height: 1.25;
      white-space: nowrap;
    }
    .tag.apply { background: var(--apply); }
    .tag.exam { background: var(--exam); }
    .tag.result { background: var(--result); }
    .tag.register { background: var(--register); }
    .tag.extra { background: var(--extra); }

    @media (max-width: 720px) {
      main { padding: 14px; }
      .subtitle { font-size: 13px; }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      button.filter {
        justify-content: center;
        width: 100%;
        padding-inline: 8px;
      }
      .chart-wrap {
        box-shadow: none;
        border-radius: 8px;
      }
      svg { min-width: 880px; }
      .cards { grid-template-columns: 1fr; }
      .card { padding: 16px; }
      .univ-button strong { font-size: 19px; }
      .track-title { font-size: 17px; }
      .event-row {
        grid-template-columns: minmax(98px, max-content) minmax(0, 1fr);
        gap: 10px;
        padding: 10px 0;
      }
      .event-date { font-size: 15px; }
      .event-name { font-size: 16px; }
      .doc-list {
        font-size: 16px;
        line-height: 1.5;
      }
      .doc-list li { margin: 8px 0; }
      .doc-line {
        align-items: baseline;
      }
      .doc-deadline {
        font-size: 14px;
      }
    }
  </style>
</head>

    <p class="subtitle">지원 예정 전형만 모아 정리했습니다. 항목 버튼을 누르면 해당 일정만 크게 볼 수 있고, 대학명을 누르면 전형별 세부 일정과 제출서류가 펼쳐집니다.</p>

    <div class="controls" aria-label="일정 항목 선택">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">전체</button>
      <button class="filter" type="button" data-filter="apply" aria-pressed="false"><span class="dot"></span>원서·서류</button>
      <button class="filter" type="button" data-filter="exam" aria-pressed="false"><span class="dot"></span>면접</button>
      <button class="filter" type="button" data-filter="result" aria-pressed="false"><span class="dot"></span>합격 발표</button>
      <button class="filter" type="button" data-filter="register" aria-pressed="false"><span class="dot"></span>등록</button>
    </div>

    <div class="chart-wrap">
      <svg class="gantt-svg" viewBox="0 0 1120 850" role="img" aria-labelledby="gantt-title gantt-desc">
        <title id="gantt-title">2027학년도 대학별 입시 일정 간트 차트</title>
        <desc id="gantt-desc">가로축은 선택한 지원 전형 일정의 실제 기간, 세로축은 대학이며 원서접수, 면접, 합격발표, 등록 일정을 표시합니다.</desc>
        <g class="plot"></g>
      </svg>
      <div class="tooltip" id="admission-gantt-tip" role="status" aria-live="polite"></div>
    </div>

    <section>
      <h2 class="section-title" id="detail-title">대학별 세부 일정</h2>
      <div class="cards" id="detail-cards"></div>
    </section>
  </main>

        { u: "DGIST", plan: "수시 일반 기초학부", docs: ["입학원서 온라인 입력", "학교생활기록부 또는 NEIS 제공 동의", "지원서 입력 항목", "해당자 지원자격 증빙서류", "합격자 등록 관련 서류"], items: [["apply", "원서 및 서류 제출", "2026-09-03", "2026-09-10"], ["result", "합격 발표", "2026-12-18", "2026-12-18"], ["register", "합격자 등록", "2026-12-21", "2026-12-23"]], tracks: [{ name: "DGIST 수시 일반 기초학부", items: [["apply", "원서 및 서류 제출", "2026-09-03", "2026-09-10"], ["result", "합격 발표", "2026-12-18", "2026-12-18"], ["register", "합격자 등록", "2026-12-21", "2026-12-23"]] }] },
        { u: "KENTECH", plan: "수시 일반", docs: ["인터넷 원서접수", "학교생활기록부 온라인 제공 동의", "해당자 서류 등기우편 제출", "지원자격 증빙서류", "합격자 등록 관련 서류"], items: [["apply", "지원서 접수", "2026-09-07", "2026-09-11"], ["apply", "서류 제출", "2026-09-07", "2026-09-14"], ["result", "1단계 합격자 발표", "2026-11-20", "2026-11-20"], ["exam", "면접평가", "2026-11-30", "2026-11-30"], ["result", "합격자 발표", "2026-12-11", "2026-12-11"], ["register", "합격자 등록", "2026-12-21", "2026-12-23"]], tracks: [{ name: "KENTECH 수시 일반", items: [["apply", "지원서 접수", "2026-09-07", "2026-09-11"], ["apply", "서류 제출", "2026-09-07", "2026-09-14"], ["result", "1단계 합격자 발표", "2026-11-20", "2026-11-20"], ["exam", "면접평가", "2026-11-30", "2026-11-30"], ["result", "합격자 발표", "2026-12-11", "2026-12-11"], ["register", "합격자 등록", "2026-12-21", "2026-12-23"]] }] }
      ];
      const svg = document.querySelector(".gantt-svg");
      const plot = document.querySelector(".plot");
      const tip = document.getElementById("admission-gantt-tip");
      const detailTitle = document.getElementById("detail-title");
      const detailCards = document.getElementById("detail-cards");
      const buttons = Array.from(document.querySelectorAll("button.filter"));
      let selectedUniversity = null;

      const parse = (s) => new Date(`${s}T00:00:00+09:00`);
      const fmt = new Intl.DateTimeFormat("ko-KR", { month: "numeric", day: "numeric", weekday: "short" });
      const rangeText = (start, end) => start === end ? fmt.format(parse(start)) : `${fmt.format(parse(start))} - ${fmt.format(parse(end))}`;
      const margin = { left: 118, right: 28, top: 54, bottom: 42 };
      const width = 1120;
      const height = 850;
      const fixedStart = parse("2026-09-01");
      const fixedEnd = parse("2027-02-20");
      let domainStart = fixedStart;
      let domainEnd = fixedEnd;
      const dayMs = 24 * 60 * 60 * 1000;
      const x = (date) => {
        const span = domainEnd - domainStart || dayMs;
        return margin.left + ((parse(date) - domainStart) / span) * (width - margin.left - margin.right);
      };
      const laneGap = 58;
      const y0 = 92;
      const barH = 12;
      const subY = { apply: -16, exam: -2, result: 12, register: 26, extra: 40 };

      const make = (name, attrs = {}) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", name);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
        return el;
      };

      const visibleItems = (items, filter) => items.filter((item) => filter === "all" || item[0] === filter);

      const isoDate = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      };

      const calculateDomain = (filter) => {
        const visible = focusedData.flatMap((row) => visibleItems(row.items, filter));

        if (!visible.length) {
          domainStart = fixedStart;
          domainEnd = fixedEnd;
          return;
        }
        const min = new Date(Math.min(...visible.map((item) => parse(item[2]).getTime())));
        const max = new Date(Math.max(...visible.map((item) => parse(item[3]).getTime())));
        domainStart = new Date(min.getTime() - 4 * dayMs);
        domainEnd = new Date(max.getTime() + 4 * dayMs);
        if (domainEnd - domainStart < 18 * dayMs) {
          const mid = (domainStart.getTime() + domainEnd.getTime()) / 2;
          domainStart = new Date(mid - 9 * dayMs);
          domainEnd = new Date(mid + 9 * dayMs);
        }
      };

      const monthTicks = () => {
        const ticks = [new Date(domainStart)];
        const cursor = new Date(domainStart.getFullYear(), domainStart.getMonth() + 1, 1);
        while (cursor <= domainEnd) {
          ticks.push(new Date(cursor));
          cursor.setMonth(cursor.getMonth() + 1);
        }
        return ticks;
      };

      const showTip = (event, row, item) => {
        tip.textContent = `${row.u} · ${item[1]} · ${rangeText(item[2], item[3])}`;
        const wrapEl = document.querySelector(".chart-wrap");
        const wrap = wrapEl.getBoundingClientRect();
        const cx = event.clientX - wrap.left + wrapEl.scrollLeft;
        const cy = event.clientY - wrap.top;
        tip.style.left = `${Math.min(Math.max(cx, 155), wrap.width - 155 + wrapEl.scrollLeft)}px`;
        tip.style.top = `${Math.max(cy, 40)}px`;
        tip.classList.add("is-visible");
      };
      const hideTip = () => tip.classList.remove("is-visible");

      const openUniversity = (name) => {
        selectedUniversity = name;
        renderDetails(currentFilter());
        document.getElementById(`card-${name}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      const currentFilter = () => buttons.find((button) => button.getAttribute("aria-pressed") === "true")?.dataset.filter || "all";

      const renderChart = (filter = "all") => {
        plot.replaceChildren();
        calculateDomain(filter);
        monthTicks().forEach((m) => {
          const xx = x(isoDate(m));
          plot.appendChild(make("line", { x1: xx, y1: margin.top, x2: xx, y2: height - margin.bottom, class: "month-line" }));
          const label = make("text", { x: xx + 6, y: 28, class: "axis-text" });
          label.textContent = `${m.getMonth() + 1}월`;
          plot.appendChild(label);
        });
        plot.appendChild(make("line", { x1: margin.left, y1: margin.top, x2: width - margin.right, y2: margin.top, class: "axis" }));

        focusedData.forEach((row, i) => {
          const y = y0 + i * laneGap;
          plot.appendChild(make("line", { x1: margin.left, y1: y + 31, x2: width - margin.right, y2: y + 31, class: "lane-line" }));
          const label = make("text", { x: 12, y: y + 4, class: "lane-label" });
          label.textContent = row.u;
          label.addEventListener("click", () => openUniversity(row.u));
          plot.appendChild(label);

          visibleItems(row.items, filter).forEach((item) => {
            const [type, name, s, e] = item;
            const yy = y + (filter === "all" ? subY[type] : 3);
            const xs = x(s);
            const xe = x(e);
            const isPoint = s === e;
            if (isPoint) {
              plot.appendChild(make("circle", { cx: xs, cy: yy + 6, r: 7, class: `milestone ${type}` }));
              const hit = make("circle", { cx: xs, cy: yy + 6, r: 15, class: "hit" });
              hit.addEventListener("mousemove", (event) => showTip(event, row, item));
              hit.addEventListener("mouseleave", hideTip);
              plot.appendChild(hit);
            } else {
              const minW = Math.max(8, xe - xs);
              plot.appendChild(make("rect", { x: xs, y: yy, width: minW, height: barH, class: `bar ${type}` }));
              const hit = make("rect", { x: xs, y: yy - 7, width: minW, height: barH + 14, class: "hit" });
              hit.addEventListener("mousemove", (event) => showTip(event, row, item));
              hit.addEventListener("mouseleave", hideTip);
              plot.appendChild(hit);
            }
            if ((filter !== "all" || ["exam", "extra"].includes(type)) && (xe - xs) > 42) {
              const text = make("text", { x: xs + 6, y: yy + 10, class: "bar-label" });
              text.textContent = name;
              plot.appendChild(text);
            }
          });
        });

        const note = make("text", { x: margin.left, y: 758, class: "note-text" });
        note.textContent = filter === "all" ? "대학명을 클릭하면 전형별 세부 일정이 펼쳐집니다." : `${categoryLabels[filter]} 항목만 표시 중입니다.`;
        plot.appendChild(note);
      };

      const renderEventRows = (container, items) => {
        items.forEach((item) => {
          const event = document.createElement("div");
          event.className = "event-row";
          const date = document.createElement("div");
          date.className = "event-date";
          date.textContent = rangeText(item[2], item[3]);
          const name = document.createElement("div");
          name.className = "event-name";
          const tag = document.createElement("span");
          tag.className = `tag ${item[0]}`;
          tag.textContent = categoryLabels[item[0]];
          const label = document.createElement("span");
          label.textContent = item[1];
          label.title = item[1];
          name.append(tag, label);
          event.append(date, name);
          container.appendChild(event);
        });
      };

      const latestDeadline = (items) => {
        if (!items.length) return null;
        return items.reduce((latest, item) => parse(item[3]) > parse(latest) ? item[3] : latest, items[0][3]);
      };

      const hasAny = (text, keywords) => keywords.some((keyword) => text.includes(keyword));

      const documentDeadline = (row, doc) => {
        const text = String(doc);
        const applyItems = row.items.filter((item) => item[0] === "apply");
        let candidates = applyItems;

        if (hasAny(text, ["정시", "수능"])) {
          candidates = row.items.filter((item) => item[0] === "extra" && hasAny(item[1], ["원서", "서류", "업로드", "접수", "지원서"]));
        } else if (hasAny(text, ["추천"])) {
          candidates = applyItems.filter((item) => hasAny(item[1], ["추천"]));
        } else if (hasAny(text, ["최종합격", "합격자", "원본", "졸업"])) {
          candidates = row.items.filter((item) => item[0] === "register");
        }

        return latestDeadline(candidates.length ? candidates : applyItems);
      };

      const renderDetails = (filter = "all") => {
        detailTitle.textContent = `${categoryLabels[filter]} 상세 일정`;
        detailCards.replaceChildren();
        focusedData.forEach((row) => {
          const card = document.createElement("article");
          card.className = "card";
          card.id = `card-${row.u}`;
          if (selectedUniversity === row.u) card.classList.add("is-open");

          const button = document.createElement("button");
          button.className = "univ-button";
          button.type = "button";
          button.setAttribute("aria-expanded", String(selectedUniversity === row.u));
          button.innerHTML = `<span class="univ-heading"><strong>${row.u}</strong><small>${row.plan}</small></span><span class="chevron">›</span>`;
          button.addEventListener("click", () => {
            selectedUniversity = selectedUniversity === row.u ? null : row.u;
            renderDetails(filter);
          });
          card.appendChild(button);

          const summary = document.createElement("div");
          summary.className = "detail";

          const filtered = visibleItems(row.items, filter);
          if (filtered.length) {
            const quickTitle = document.createElement("p");
            quickTitle.className = "track-title";
            quickTitle.textContent = "핵심 일정";
            summary.appendChild(quickTitle);
            renderEventRows(summary, filtered);
          }

          row.tracks.forEach((track) => {
            const trackEl = document.createElement("div");
            trackEl.className = "track";
            const title = document.createElement("p");
            title.className = "track-title";
            title.textContent = track.name;
            trackEl.appendChild(title);
            renderEventRows(trackEl, visibleItems(track.items, filter));
            summary.appendChild(trackEl);
          });

          const docsTitle = document.createElement("p");
          docsTitle.className = "track-title";
          docsTitle.textContent = "제출서류";
          const docs = document.createElement("ul");
          docs.className = "doc-list";
          row.docs.forEach((doc) => {
            const li = document.createElement("li");
            const line = document.createElement("span");
            line.className = "doc-line";
            const label = document.createElement("span");
            label.className = "doc-label";
            label.textContent = doc;
            const deadline = document.createElement("span");
            deadline.className = "doc-deadline";
            const due = documentDeadline(row, doc);
            deadline.textContent = due ? `마감 ${fmt.format(parse(due))}` : "마감 확인 필요";
            line.append(label, deadline);
            li.appendChild(line);
            docs.appendChild(li);
          });
          const docsWrap = document.createElement("div");
          docsWrap.className = "track";
          docsWrap.append(docsTitle, docs);
          summary.appendChild(docsWrap);

          card.appendChild(summary);
          detailCards.appendChild(card);
        });
      };

      const setFilter = (filter) => {
        buttons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.filter === filter)));
        renderChart(filter);
        renderDetails(filter);
      };

      buttons.forEach((button) => button.addEventListener("click", () => setFilter(button.dataset.filter)));
      setFilter("all");
    })();
